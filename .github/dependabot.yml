version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:17'
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      routine-npm:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:47'
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
